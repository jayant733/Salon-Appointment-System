spring:
  application:
    name: salonplan

  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://loacalhost:5432/salonplan}
    username: ${DB_USER:salon}
    password: ${DB_PASSWORD:salon}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

salonplan:
  jwt:
    issuer: salonplan
    secret: ${JWT_SECRET:development-secret-must-be-at-least-32-characters}
    access-token-minutes: 30

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8088}

  bootstrap:
    admin-email: ${ADMIN_EMAIL:admin@salonplan.local}
    admin-password: ${ADMIN_PASSWORD:admin-change-me}
    employee-email: ${EMPLOYEE_EMAIL:employee@salonplan.local}
    employee-password: ${EMPLOYEE_PASSWORD:employee-change-me}

  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@salonplan.local}