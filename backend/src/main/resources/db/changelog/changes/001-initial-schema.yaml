databaseChangeLog:
  - changeSet:
      id: 001-create-test-table
      author: salonplan
      changes:
        - createTable:
            tableName: application_status
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false