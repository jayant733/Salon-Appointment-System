spring:
  jpa:
    show-sql: true
  mail:
    host: localhost
    port: 1025
    protocol: smtp

    properties:
      "[mail.smtp.auth]": false
      "[mail.smtp.starttls.enable]": false
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

salonplan:
  mail:
    enabled: true
    from: noreply@salonplan.local
  jwt:
    issuer: salonplan
    secret: ${JWT_SECRET:development-secret-must-be-at-least-32-characters}
    access-token-minutes: 30

management:
  health:
    mail:
      enabled: true
logging:
  level:
    de.salonplan: DEBUG
