services:
  db:
    image: postgres:17-alpine
    container_name: salonplan-db-dev

    environment:
      POSTGRES_DB: ${DB_NAME:-salonplan}
      POSTGRES_USER: ${DB_USER:-salon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-salon}

    ports:
      - "5432:5432"

    volumes:
      - salonplan-dev-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  salonplan-dev-data: