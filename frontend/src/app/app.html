<div class="app-shell" [class.login-shell]="!auth.authenticated()">
  <header class="topbar">
    <a class="brand" routerLink="/appointments" aria-label="SalonPlan Startseite">
      <span class="brand-mark" aria-hidden="true">SP</span>
      <span>
        <strong>SalonPlan</strong>
        <small>Terminverwaltung</small>
      </span>
    </a>

    @if (auth.authenticated()) {
      <nav class="main-nav" aria-label="Hauptnavigation">
        <a routerLink="/appointments" routerLinkActive="active">Termine</a>
        <a routerLink="/customers" routerLinkActive="active">Kunden</a>
        @if (isAdmin()) {
          <a routerLink="/employees" routerLinkActive="active">Mitarbeiter</a>
          <a routerLink="/services" routerLinkActive="active">Leistungen</a>
          <a routerLink="/users" routerLinkActive="active">Benutzer</a>
        }
      </nav>

      <div class="account-menu">
        <span class="account-copy">
          <strong>{{ auth.email() }}</strong>
          <small>{{ roleLabel() }}</small>
        </span>
        <button class="button secondary compact" type="button" (click)="logout()">Abmelden</button>
      </div>
    }
  </header>

  <div class="notification-stack" aria-live="polite" aria-atomic="false">
    @for (notification of notifications.messages(); track notification.id) {
      <div class="notification" [class]="'notification ' + notification.type" role="status">
        <span>{{ notification.message }}</span>
        <button
          type="button"
          aria-label="Meldung schließen"
          (click)="notifications.remove(notification.id)"
        >
          ×
        </button>
      </div>
    }
  </div>

  <main class="page-content">
    <router-outlet />
  </main>
</div>
